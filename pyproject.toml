[tool.poetry]
name = "python_linter"
version = "0.0.1"
description = "Python Linter"
authors = [
    "Dmitry [d.veselkov2017@yandex.ru] Veselkov",
]
package-mode = false

[tool.poetry.dependencies]
python = "3.13.2"
mypy = "^1.17.1"
isort = "^6.0.1"
black = "^25.1.0"
flake8 = "^7.3.0"
pre-commit = "^4.3.0"

[tool.black]
line-length = 120
target-version = ['py313']
skip-string-normalization = true
